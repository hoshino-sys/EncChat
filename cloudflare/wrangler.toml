name = "encchat-relay"
main = "worker.ts"
compatibility_date = "2024-04-01"

routes = [
  { pattern = "chat.nightstar.top/ws*", zone_name = "nightstar.top" },
  { pattern = "chat.nightstar.top/api*", zone_name = "nightstar.top" },
  { pattern = "chat.nightstar.top/download*", zone_name = "nightstar.top" }
]

[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]
